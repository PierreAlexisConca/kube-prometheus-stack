server.port=8082
spring.application.name=dispensary-service

# Exponer Actuator en la raiz con mapeo de prometheus a /metrics
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Configuracion de comunicacion con Servicio A (recipe-service)
services.recipe.url=${RECIPE_SERVICE_URL:http://recipe-service:8081}
# Timeout en milisegundos para llamadas hacia recipe-service
services.recipe.timeout-ms=${RECIPE_TIMEOUT_MS:2500}

# Simulacion de fallo en health check
app.simulate.failure=${SIMULATE_FAILURE:false}
