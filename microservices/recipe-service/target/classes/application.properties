server.port=8081
spring.application.name=recipe-service

# Exponer Actuator en la raiz con mapeo de prometheus a /metrics
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Configuracion de latencia artificial para Casuistica 2
app.delay.ms=${DELAY_MS:0}

# Configuracion de fallo simulado para Casuistica 1
app.simulate.failure=${SIMULATE_FAILURE:false}
