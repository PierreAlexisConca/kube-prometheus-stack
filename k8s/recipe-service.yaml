apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-deployment
  namespace: telemed-ns
  labels:
    app: recipe-service
    domain: telemed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recipe-service
  template:
    metadata:
      labels:
        app: recipe-service
        domain: telemed
    spec:
      containers:
        - name: recipe-service
          image: recipe-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: DELAY_MS
              value: "0"
            - name: SIMULATE_FAILURE
              value: "false"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: recipe-service
  namespace: telemed-ns
  labels:
    app: recipe-service
    domain: telemed
spec:
  type: NodePort
  selector:
    app: recipe-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
