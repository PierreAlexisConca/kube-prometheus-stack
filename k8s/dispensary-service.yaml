apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispensary-deployment
  namespace: telemed-ns
  labels:
    app: dispensary-service
    domain: telemed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispensary-service
  template:
    metadata:
      labels:
        app: dispensary-service
        domain: telemed
    spec:
      containers:
        - name: dispensary-service
          image: dispensary-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: RECIPE_SERVICE_URL
              value: "http://recipe-service.telemed-ns.svc.cluster.local:8081"
            - name: RECIPE_TIMEOUT_MS
              value: "2500"
            - name: SIMULATE_FAILURE
              value: "false"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: dispensary-service
  namespace: telemed-ns
  labels:
    app: dispensary-service
    domain: telemed
spec:
  type: NodePort
  selector:
    app: dispensary-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      nodePort: 30082
